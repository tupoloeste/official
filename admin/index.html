}

<body>
<div class="wrap">
<div id="apiWarning" class="card hidden">
    <div class="msg err">
      Apps Script API URL is not configured yet. Edit <b>admin/index.html</b> and set <b>API_URL</b>.

           onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('loginBtn').click()}">

  </div>

  <div id="app" class="hidden">
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand" style="margin:0">
          <img class="brand-logo" src="../barangay-logo.png" alt="Barangay Tupol Oeste Logo">

            <strong>Barangay Tupol Oeste</strong>
            <small>Encoder Portal</small>
          </div>
        </div>
      </div>

      <div class="topbar-user">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-meta">
          <strong id="who"></strong>
          <small id="role"></small>
        </div>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>

        <div id="dashboardView">
      <div class="card">
        <h3>My Modules</h3>
        <div id="moduleMenu" class="menu"></div>
      </div>
    </div>

    <div id="moduleView" class="hidden">
      <div class="card">
        <div class="module-page-header">
          <h2 id="modulePageTitle">Module</h2>
          <button class="back-btn" onclick="backToModules()">← Back to My Modules</button>
        </div>
        <div id="moduleArea"></div>
      </div>
    </div>
  </div>
</div>

<script>
console.info('BTO ADMIN BUILD: 2026-10-07 LOGIN-HARD-FIX-3');

function ensureGlobalActionStatus(){
  let el=document.getElementById('globalActionStatus');
  if(!el){
    el=document.createElement('div');
    el.id='globalActionStatus';
    el.className='global-action-status';
    document.body.appendChild(el);
  }
  return el;
}

function showGlobalActionStatus(message,type=''){
  const el=ensureGlobalActionStatus();
  el.textContent=message||'';
  el.className='global-action-status show'+(type?' '+type:'');
  clearTimeout(showGlobalActionStatus._t);
  showGlobalActionStatus._t=setTimeout(()=>{
    el.classList.remove('show');
  },2600);
}

function setBusyButton(btn,busy,label){
  if(!btn) return;

  if(busy){
    if(!btn.dataset.originalHtml) btn.dataset.originalHtml=btn.innerHTML;
    btn.disabled=true;
    btn.classList.add('is-busy');
    btn.innerHTML=`<span class="btn-spinner"></span>${label||'Saving...'}`;
  }else{
    btn.disabled=false;
    btn.classList.remove('is-busy');
    if(btn.dataset.originalHtml){
      btn.innerHTML=btn.dataset.originalHtml;
      delete btn.dataset.originalHtml;
    }
  }
}

async function withButtonSpinner(btnOrEvent,label,fn,successMessage){
  const btn = btnOrEvent instanceof HTMLElement
    ? btnOrEvent
    : (btnOrEvent?.currentTarget || null);

  if(btn?.classList?.contains('is-busy')) return;

  setBusyButton(btn,true,label||'Saving...');

  try{
    const result=await fn();

    if(result && result.success===false){
      throw new Error(result.message || 'Action failed.');
    }

    if(successMessage){
      showGlobalActionStatus(successMessage,'ok');
    }

    return result;
  }catch(err){
    showGlobalActionStatus(err?.message || 'Action failed.','err');
    throw err;
  }finally{
    setBusyButton(btn,false);
  }
}


/* ============================================================
   CONFIGURATION
   Paste the deployed Apps Script Web App /exec URL below.
   Example:
   const API_URL = 'https://script.google.com/macros/s/AKfycbwM6bagjlHKao-NCB3d_nDwX29zO4EFKcoj50vABCQP7bKJuSI4j7772Zam9LwNiLCqNg/exec';
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwM6bagjlHKao-NCB3d_nDwX29zO4EFKcoj50vABCQP7bKJuSI4j7772Zam9LwNiLCqNg/exec';

let token = localStorage.getItem('btoToken') || '';
let me = null;


const BTO_CACHE_TTL = 30 * 60 * 1000; // 30 minutes

function cacheSet(key,value){
  try{
    localStorage.setItem('bto_cache_'+key,JSON.stringify({
      savedAt:Date.now(),
      value:value
    }));
  }catch(e){}
}

function cacheGet(key,maxAge=BTO_CACHE_TTL){
  try{
    const raw=localStorage.getItem('bto_cache_'+key);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || !obj.savedAt) return null;
    if(Date.now()-obj.savedAt > maxAge) return null;
    return obj.value;
  }catch(e){
    return null;
  }
}

function cacheRemove(key){
  try{localStorage.removeItem('bto_cache_'+key)}catch(e){}
}

function setStatus(text){
  // Status bar intentionally hidden for a cleaner portal UI.
}

function apiConfigured(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API_URL);
}

async function api(action,data={}){
  if(!apiConfigured()){
    return {success:false,message:'Apps Script API URL is not configured.'};
  }

  const payload={action,token,data};

  if(action==='login'){
    payload.username=data.username || '';
    payload.password=data.password || '';
  }

  try{
    const response=await fetch(API_URL,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });

    const text=await response.text();

    try{
      return JSON.parse(text);
    }catch(e){
      throw new Error('Backend returned a non-JSON response. Check the Apps Script deployment URL and access settings.');
    }
  }catch(err){
    return {success:false,message:err.message || String(err)};
  }
}

async function login(triggerBtn){
  const btn=triggerBtn || document.getElementById('loginBtn');
  const msg=document.getElementById('loginMsg');

  if(btn?.classList?.contains('is-busy')) return;

  setBusyButton(btn,true,'Signing in...');
  if(msg) msg.innerHTML='';

  try{
    const r=await api('login',{
      username:document.getElementById('username').value.trim(),
      password:document.getElementById('password').value
    });

    if(!r.success){
      if(msg) msg.innerHTML='<div class="msg err">'+esc(r.message)+'</div>';
      return;
    }

    token=r.token;
    me=r.user;
    localStorage.setItem('btoToken',token);
    cacheSet('me',me);

    renderApp();

    api('getCommittees').then(c=>{
      if(c && c.success){
        window.BTO_COMMITTEES_CACHE=c.data||[];
        cacheSet('committees',window.BTO_COMMITTEES_CACHE);
        renderApp();
      }
    }).catch(()=>{});

  }catch(err){
    if(msg) msg.innerHTML='<div class="msg err">'+esc(err?.message || 'Login failed.')+'</div>';
    showGlobalActionStatus(err?.message || 'Login failed.','err');
  }finally{
    setBusyButton(btn,false);
  }
}

async function logout(){
  await api('logout');
  localStorage.removeItem('btoToken');
  cacheRemove('me');
  token=''; me=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('password').value='';
}

function hasModule(name){
  if(!me) return false;
  if(['SUPER_ADMIN','ADMIN'].includes(me.role)) return true;
  const mods=(me.assignedModules||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
  return mods.includes('ALL') || mods.includes(name.toUpperCase());
}

function renderApp(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  const displayName=me.fullName || me.username || 'User';
  document.getElementById('who').textContent=displayName;

  let positionLabel='';
  if(me.role==='SUPER_ADMIN') positionLabel='System Administrator';
  else if(me.role==='ADMIN') positionLabel='Administrator';
  else if(me.role==='KAGAWAD') positionLabel='Barangay Kagawad';
  else if(me.role==='ENCODER') positionLabel='Authorized Encoder';
  else positionLabel=me.role || '';

  document.getElementById('role').textContent=positionLabel;
  document.getElementById('userAvatar').textContent=(displayName.trim().charAt(0)||'U').toUpperCase();

  const items=[];
  if(hasModule('OFFICIALS')) items.push(['Officials','officials']);

  if(['SUPER_ADMIN','ADMIN'].includes(me.role))
    items.push(['Committee Assignments','assignments']);

  if(hasModule('BARANGAY_STATISTICS')) items.push(['Barangay Statistics','stats']);
  if(hasModule('LIVESTOCK')) items.push(['Livestock Statistics','livestock']);

  if(hasModule('CONTENT') || (me.assignedModules||'').includes('COM-'))
    items.push(['Announcements & Activities','content']);

  if(['SUPER_ADMIN','ADMIN'].includes(me.role)){
    items.push(['Users','users']);
    items.push(['Site Media','siteMedia']);
    items.push(['Committees Management','committees']);
  }

  const committees=window.BTO_COMMITTEES_CACHE||[];

  if(['SUPER_ADMIN','ADMIN'].includes(me.role)){
    items.push(['Committee Profiles','committeeProfiles']);
  }else{
    const allowed=String(me.assignedModules||'')
      .split(',').map(x=>x.trim().toUpperCase()).filter(x=>x.startsWith('COM-'));

    committees
      .filter(c=>allowed.includes(String(c.committeeId).toUpperCase()))
      .forEach(c=>items.push([c.committeeName,'committee:'+c.committeeId]));
  }

  document.getElementById('moduleMenu').innerHTML=
    items.map(i=>`<button onclick="openModule('${i[1]}','${esc(i[0])}')">${esc(i[0])}</button>`).join('');

  // Always return to clean dashboard after login/refresh.
  document.getElementById('dashboardView').classList.remove('hidden');
  document.getElementById('moduleView').classList.add('hidden');
  document.getElementById('moduleArea').innerHTML='';
}

async function restore(){
  if(!apiConfigured()){
    document.getElementById('apiWarning').classList.remove('hidden');
    return;
  }
  if(!token) return;

  const cachedMe=cacheGet('me');
  const cachedCommittees=cacheGet('committees');

  if(cachedCommittees) window.BTO_COMMITTEES_CACHE=cachedCommittees;

  // Instant UI from last successful session.
  if(cachedMe){
    me=cachedMe;
    renderApp();
    setStatus('Opening cached data… refreshing in background');
  }

  // Verify session and refresh without blocking the screen.
  const r=await api('bootstrap');

  if(r.success){
    me=r.user;
    window.BTO_COMMITTEES_CACHE=r.committees||window.BTO_COMMITTEES_CACHE||[];
    cacheSet('me',me);
    cacheSet('committees',window.BTO_COMMITTEES_CACHE);
    renderApp();
    }else{
    localStorage.removeItem('btoToken');
    cacheRemove('me');
    token='';
    me=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
  }
}

const BTO_OFFICIAL_POSITION_OPTIONS = {
  BARANGAY: [
    'Punong Barangay',
    'Sangguniang Barangay Member',
    'Barangay Secretary',
    'Barangay Treasurer'
  ],
  SK: [
    'SK Chairperson',
    'Sangguniang Kabataan Member'
  ],
  TANOD: [
    'Chief Tanod',
    'Barangay Tanod Member'
  ]
};

function normalizedOfficialGroup(group){
  const g=String(group||'').trim().toUpperCase();

  if(g==='SANGGUNIANG KABATAAN' || g==='SK') return 'SK';
  if(g==='BARANGAY TANOD' || g==='TANOD') return 'TANOD';
  return 'BARANGAY';
}

function updateOfficialPositionOptions(selectedValue){
  const groupEl=document.getElementById('oGroup');
  const posEl=document.getElementById('oPosition');
  if(!groupEl || !posEl) return;

  const group=normalizedOfficialGroup(groupEl.value);
  const options=BTO_OFFICIAL_POSITION_OPTIONS[group] || [];

  const current=String(
    selectedValue !== undefined ? selectedValue : posEl.value
  ).trim();

  posEl.innerHTML=
    '<option value="">Select position</option>'+
    options.map(position=>
      `<option value="${esc(position)}">${esc(position)}</option>`
    ).join('');

  if(current){
    const exact=options.find(x=>x.toUpperCase()===current.toUpperCase());
    if(exact){
      posEl.value=exact;
    }else{
      // Preserve an existing legacy position without losing data.
      const legacy=document.createElement('option');
      legacy.value=current;
      legacy.textContent=current;
      legacy.dataset.legacy='1';
      posEl.appendChild(legacy);
      posEl.value=current;
    }
  }
}

  document.getElementById('uName').value=u.fullName||'';
  document.getElementById('uRole').value=u.role||'ENCODER';
  document.getElementById('uStatus').value=u.status||'ACTIVE';

  document.querySelectorAll('.moduleCheck,.committeeCheck').forEach(x=>x.checked=false);

  access.forEach(a=>{

function renderCommitteeWorkspace(){
  const c=currentCommitteeData.committee;
  const entries=currentCommitteeData.entries||[];
  const content=currentCommitteeData.content||[];

  const stats=entries.filter(x=>x.Section==='STATISTIC' && String(x.Status).toUpperCase()==='ACTIVE');

  document.getElementById('moduleArea').innerHTML=`

    </div>`;

  renderCommitteeSectionBody(entries,content);

function setCommitteeSection(section){
  currentCommitteeSection=section;
  renderCommitteeWorkspace();
}

function renderCommitteeSectionBody(entries,content){
  const body=document.getElementById('committeeSectionBody');

  if(currentCommitteeSection==='ACTIVITY'){
    const today=new Date(); today.setHours(0,0,0,0);
    const rows=content.slice().sort((a,b)=>String(b['Event Date']||'').localeCompare(String(a['Event Date']||'')));

    const upcoming=rows.filter(x=>{
      if(!x['Event Date']) return false;
      const d=new Date(x['Event Date']); d.setHours(0,0,0,0);
      return d>=today;
    });
    const recent=rows.filter(x=>{
      if(!x['Event Date']) return true;
      const d=new Date(x['Event Date']); d.setHours(0,0,0,0);
      return d<today;
    });

    body.innerHTML=`
      <h3>Upcoming Activities / Announcements</h3>
      ${renderCommitteeContentRows(upcoming)}
      <h3 style="margin-top:18px">Recent Activities</h3>
      ${renderCommitteeContentRows(recent)}
      <button onclick="openCommitteeQuickActivity()">Add Committee Activity / Announcement</button>`;
    return;
  }

  const sectionEntries=entries.filter(x=>
    String(x.Section).toUpperCase()===currentCommitteeSection &&
    String(x.Status).toUpperCase()!=='DELETED'
  );

  body.innerHTML=`
    <div id="committeeEntryForm">${committeeEntryFormHtml()}</div>
    <hr>
    <h3>Existing ${committeeSectionLabel(currentCommitteeSection)}</h3>
    ${sectionEntries.length ? sectionEntries.map(renderCommitteeEntry).join('') : '<p class="help">No records yet.</p>'}`;
}

function committeeSectionLabel(section){
  return ({
    STATISTIC:'Statistics',
    ORGANIZATION:'Organizations / Associations',
    SERVICE:'Services',
    PROGRAM:'Programs & Projects',
    REPORT:'Reports / Documents'
  })[section] || section;
}

async function saveCommitteeEntry(){
  if(committeeSaveInProgress) return;

  const btn=document.getElementById('cpSaveBtn');
  const status=document.getElementById('cpSaveStatus');

  committeeSaveInProgress=true;
  if(btn){
    btn.disabled=true;
    btn.classList.add('is-saving');
    btn.innerHTML='<span class="save-mini-spinner"></span> Saving...';
  }
  if(status){
    status.className='save-status';
    status.textContent='Please wait while the record is being saved.';
  }

  try{
    let linkUrl=document.getElementById('cpLink').value.trim();
    const file=document.getElementById('cpFile')?.files?.[0];

    if(file){
      if(status) status.textContent='Uploading file...';
      const base64=await fileToBase64(file);
      const up=await api('uploadBase64',{
        fileName:file.name,
        mimeType:file.type||'application/octet-stream',
        base64
      });
      if(!up.success) throw new Error(up.message);
      linkUrl=up.url;
      if(status) status.textContent='Saving record...';
    }

    const data={
      entryId:document.getElementById('cpEntryId').value,
      committeeId:currentCommitteeId,
      section:currentCommitteeSection,
      title:document.getElementById('cpTitle').value.trim(),
      value:document.getElementById('cpValue')?.value || '',
      unit:document.getElementById('cpUnit')?.value || '',
      description:document.getElementById('cpDescription').value.trim(),
      linkUrl,
      status:document.getElementById('cpStatus').value,
      sortOrder:document.getElementById('cpSort').value,
      asOfDate:document.getElementById('cpAsOf')?.value || ''
    };

    if(!data.title) throw new Error('Title is required.');

    const r=await api('saveCommitteeProfileEntry',data);
    if(!r.success) throw new Error(r.message);

    if(status){
      status.className='save-status ok';
      status.textContent='Saved successfully.';
    }

    // Small pause so the user sees the confirmation before refresh.
    await new Promise(resolve=>setTimeout(resolve,650));
    await refreshCommittee();

  }catch(err){
    if(status){
      status.className='save-status err';
      status.textContent=err.message || 'Save failed.';
    }
    alert(err.message || 'Save failed.');
  }finally{
    committeeSaveInProgress=false;
    const currentBtn=document.getElementById('cpSaveBtn');
    if(currentBtn){
      currentBtn.disabled=false;
      currentBtn.classList.remove('is-saving');
      currentBtn.textContent='Save';
    }
  }
}

async function saveCommitteeQuickActivity(triggerBtn){
  if(quickActivitySaveInProgress) return;

  const btn=triggerBtn || document.getElementById('qaSaveBtn');
  const status=document.getElementById('qaSaveStatus');
  quickActivitySaveInProgress=true;

  if(btn){
    btn.disabled=true;
    btn.classList.add('is-saving');
    btn.innerHTML='<span class="save-mini-spinner"></span> Publishing...';
  }
  if(status){
    status.className='save-status';
    status.textContent='Preparing files...';
  }

  try{
    let featuredPhotoUrl='';
    const featuredFile=document.getElementById('qaPhoto')?.files?.[0];

    if(featuredFile){
      if(status) status.textContent='Uploading featured photo...';
      const base64=await fileToBase64(featuredFile);
      const u=await api('uploadBase64',{
        fileName:featuredFile.name,
        mimeType:featuredFile.type||'image/jpeg',
        base64
      });
      if(!u.success) throw new Error(u.message);
      featuredPhotoUrl=u.url;
    }

    const galleryFiles=Array.from(document.getElementById('qaGallery')?.files||[]);
    const galleryUrls=[];

    for(let i=0;i<galleryFiles.length;i++){
      const file=galleryFiles[i];
      if(status) status.textContent=`Uploading gallery photo ${i+1} of ${galleryFiles.length}...`;

      const base64=await fileToBase64(file);
      const u=await api('uploadBase64',{
        fileName:file.name,
        mimeType:file.type||'image/jpeg',
        base64
      });
      if(!u.success) throw new Error(u.message);
      galleryUrls.push(u.url);
    }

    if(status) status.textContent='Publishing event/activity...';

    const title=document.getElementById('qaTitle').value.trim();
    if(!title) throw new Error('Title is required.');

    const r=await api('saveContent',{
      type:document.getElementById('qaType').value,
      title,
      eventDate:document.getElementById('qaDate').value,
      time:document.getElementById('qaTime').value,
      venue:document.getElementById('qaVenue').value.trim(),
      committeeId:currentCommitteeId,
      description:document.getElementById('qaDesc').value.trim(),
      featuredPhotoUrl,
      galleryUrls:galleryUrls.join('\\n'),
      status:'PUBLISHED'
    });

    if(!r.success) throw new Error(r.message);

    if(status){
      status.className='save-status ok';
      status.textContent='Published successfully.';
    }

    showGlobalActionStatus('Published successfully.','ok');
    await new Promise(resolve=>setTimeout(resolve,650));
    await refreshCommittee();
    currentCommitteeSection='ACTIVITY';
    renderCommitteeWorkspace();

  }catch(err){
    if(status){
      status.className='save-status err';
      status.textContent=err.message || 'Publish failed.';
    }
    showGlobalActionStatus(err.message || 'Publish failed.','err');
  }finally{
    quickActivitySaveInProgress=false;
    if(btn){
      btn.disabled=false;
      btn.classList.remove('is-saving');
      btn.textContent='Save & Publish';
    }
  }
}


function displayDate(v){
  if(!v) return '';
  try{
    const d=new Date(v);
    if(isNaN(d)) return String(v);
    return d.toLocaleDateString('en-PH',{
      year:'numeric',
      month:'long',
      day:'numeric'
    });
  }catch(e){
    return String(v);
  }
}

function displayTime(v){
  if(!v) return '';

  // Handles plain HH:mm / HH:mm:ss
  const s=String(v);
  const m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(m){
    let h=Number(m[1]);
    const min=m[2];
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    return `${h}:${min} ${ap}`;
  }

  // Handles Google Sheets time values serialized as 1899-12-30T...
  try{
    const d=new Date(v);
    if(!isNaN(d)){
      return d.toLocaleTimeString('en-PH',{
        hour:'numeric',
        minute:'2-digit',
        hour12:true,
        timeZone:'Asia/Manila'
      });
    }
  }catch(e){}

  return s;
}

function dateInputValue(v){
  if(!v) return '';
  if(typeof v==='string') return v.slice(0,10);
  try{
    const d=new Date(v);
    if(isNaN(d)) return '';
    return d.toISOString().slice(0,10);
  }catch(e){return ''}
}

function normalizePortalImageUrl(url){
  url=String(url||'').trim();
  if(!url) return '';
  if(url.includes('drive.google.com')){
    let id='';
    let m=url.match(/[?&]id=([^&]+)/);
    if(m) id=m[1];
    if(!id){
      m=url.match(/\/d\/([^/]+)/);
      if(m) id=m[1];
    }
    if(id) return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
  }
  return url;
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
