<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8324b">
<title>Barangay Tupol Oeste | Encoder Portal</title>
<style>
:root{
  --red:#f8324b;--red-dark:#c81f35;--bg:#f5f6f8;--card:#fff;
  --border:#e5e7eb;--text:#202124;--muted:#6b7280;--shadow:0 8px 28px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:18px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand-mark{width:50px;height:50px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
.brand strong{display:block;font-size:17px}
.brand small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}
h2,h3{margin-top:0}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;
  margin:5px 0 11px;background:#fff;font:inherit
}
textarea{min-height:100px;resize:vertical}
button{
  border:0;background:var(--red);color:#fff;padding:10px 14px;border-radius:9px;
  font-weight:800;cursor:pointer
}
button:hover{background:var(--red-dark)}
button.secondary{background:#333}
button.light{background:#fff;color:#333;border:1px solid #ddd}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{min-height:84px}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:10px;border-radius:8px;margin:10px 0}
.err{background:#fff0f3;color:#9f1239}
.ok{background:#ecfdf3;color:#166534}
.help{font-size:12px;color:var(--muted);margin-top:-5px;margin-bottom:10px}
.check-section{margin:14px 0}
.check-section h4{margin:0 0 8px}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check-item{
  display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);
  border-radius:9px;padding:9px;background:#fafafa
}
.check-item input{width:auto;margin:2px 0 0}
.check-item label{margin:0;font-size:13px;cursor:pointer}
.user-row,.record-row{
  border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;
  display:flex;justify-content:space-between;gap:10px;align-items:center
}
.user-row small,.record-row small{display:block;color:var(--muted);margin-top:2px}
.statusbar{
  font-size:12px;color:var(--muted);padding:8px 10px;background:#fff;
  border:1px solid var(--border);border-radius:9px;margin-bottom:14px
}
hr{border:0;border-top:1px solid #eee;margin:16px 0}
@media(max-width:760px){
  .grid,.menu,.check-grid{grid-template-columns:1fr}
  .user-row,.record-row{align-items:flex-start;flex-direction:column}
}

.committee-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.section-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.section-tabs button{background:#fff;color:#333;border:1px solid #ddd;padding:8px 11px}
.section-tabs button.active{background:var(--red);color:#fff;border-color:var(--red)}
.entry-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;background:#fff}
.entry-card h4{margin:0 0 5px}
.entry-card p{margin:4px 0;color:#4b5563}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{border:1px solid var(--border);border-radius:12px;padding:13px;background:#fafafa}
.stat-box strong{display:block;font-size:22px;color:var(--red-dark)}
.committee-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.committee-picker button{text-align:left;min-height:70px}
@media(max-width:760px){.stat-grid,.committee-picker{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">BTO</div>
    <div><strong>Barangay Tupol Oeste</strong><small>Encoder Portal</small></div>
  </div>

  <div id="apiWarning" class="card hidden">
    <div class="msg err">
      Apps Script API URL is not configured yet. Edit <b>admin/index.html</b> and set <b>API_URL</b>.
    </div>
  </div>

  <div id="loginCard" class="card">
    <h2>Login</h2>
    <label>Username</label>
    <input id="username" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') login()">
    <button id="loginBtn" onclick="login()">Sign In</button>
    <div id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><strong id="who"></strong><br><small id="role"></small></div>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="statusbar" id="statusbar">Connected to Barangay backend</div>

    <div class="card">
      <h3>My Modules</h3>
      <div id="moduleMenu" class="menu"></div>
    </div>

    <div id="moduleArea"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURATION
   Paste the deployed Apps Script Web App /exec URL below.
   Example:
   const API_URL = 'https://script.google.com/macros/s/AKfycbwM6bagjlHKao-NCB3d_nDwX29zO4EFKcoj50vABCQP7bKJuSI4j7772Zam9LwNiLCqNg/exec';
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwM6bagjlHKao-NCB3d_nDwX29zO4EFKcoj50vABCQP7bKJuSI4j7772Zam9LwNiLCqNg/exec';

let token = localStorage.getItem('btoToken') || '';
let me = null;


const BTO_CACHE_TTL = 30 * 60 * 1000; // 30 minutes

function cacheSet(key,value){
  try{
    localStorage.setItem('bto_cache_'+key,JSON.stringify({
      savedAt:Date.now(),
      value:value
    }));
  }catch(e){}
}

function cacheGet(key,maxAge=BTO_CACHE_TTL){
  try{
    const raw=localStorage.getItem('bto_cache_'+key);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || !obj.savedAt) return null;
    if(Date.now()-obj.savedAt > maxAge) return null;
    return obj.value;
  }catch(e){
    return null;
  }
}

function cacheRemove(key){
  try{localStorage.removeItem('bto_cache_'+key)}catch(e){}
}

function setStatus(text){
  const el=document.getElementById('statusbar');
  if(el) el.textContent=text;
}

function apiConfigured(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API_URL);
}

async function api(action,data={}){
  if(!apiConfigured()){
    return {success:false,message:'Apps Script API URL is not configured.'};
  }

  const payload={action,token,data};

  if(action==='login'){
    payload.username=data.username || '';
    payload.password=data.password || '';
  }

  try{
    const response=await fetch(API_URL,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });

    const text=await response.text();

    try{
      return JSON.parse(text);
    }catch(e){
      throw new Error('Backend returned a non-JSON response. Check the Apps Script deployment URL and access settings.');
    }
  }catch(err){
    return {success:false,message:err.message || String(err)};
  }
}

async function login(){
  const btn=document.getElementById('loginBtn');
  const msg=document.getElementById('loginMsg');
  btn.disabled=true; btn.textContent='Signing in...'; msg.innerHTML='';

  const r=await api('login',{
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value
  });

  btn.disabled=false; btn.textContent='Sign In';

  if(!r.success){
    msg.innerHTML='<div class="msg err">'+esc(r.message)+'</div>';
    return;
  }

  token=r.token;
  me=r.user;
  localStorage.setItem('btoToken',token);
  cacheSet('me',me);

  // Render immediately after successful login.
  renderApp();
  setStatus('Connected to Barangay backend');

  // Load committees in the background instead of blocking the login screen.
  api('getCommittees').then(c=>{
    if(c && c.success){
      window.BTO_COMMITTEES_CACHE=c.data||[];
      cacheSet('committees',window.BTO_COMMITTEES_CACHE);
      renderApp();
    }
  });
}

async function logout(){
  await api('logout');
  localStorage.removeItem('btoToken');
  cacheRemove('me');
  token=''; me=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('password').value='';
}

function hasModule(name){
  if(!me) return false;
  if(['SUPER_ADMIN','ADMIN'].includes(me.role)) return true;
  const mods=(me.assignedModules||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
  return mods.includes('ALL') || mods.includes(name.toUpperCase());
}

function renderApp(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('who').textContent=me.fullName || me.username;
  document.getElementById('role').textContent=me.role;

  const items=[];
  if(hasModule('OFFICIALS')) items.push(['Officials','officials']);

  // Committee Assignments is ADMIN-ONLY.
  if(['SUPER_ADMIN','ADMIN'].includes(me.role))
    items.push(['Committee Assignments','assignments']);

  if(hasModule('BARANGAY_STATISTICS')) items.push(['Barangay Statistics','stats']);
  if(hasModule('LIVESTOCK')) items.push(['Livestock Statistics','livestock']);

  if(hasModule('CONTENT') || (me.assignedModules||'').includes('COM-'))
    items.push(['Announcements & Activities','content']);

  if(['SUPER_ADMIN','ADMIN'].includes(me.role))
    items.push(['Users','users']);

  const committees=window.BTO_COMMITTEES_CACHE||[];

  if(['SUPER_ADMIN','ADMIN'].includes(me.role)){
    items.push(['Committee Profiles','committeeProfiles']);
  }else{
    const allowed=String(me.assignedModules||'')
      .split(',').map(x=>x.trim().toUpperCase()).filter(x=>x.startsWith('COM-'));

    committees
      .filter(c=>allowed.includes(String(c.committeeId).toUpperCase()))
      .forEach(c=>items.push([c.committeeName,'committee:'+c.committeeId]));
  }

  document.getElementById('moduleMenu').innerHTML=
    items.map(i=>`<button onclick="openModule('${i[1]}')">${esc(i[0])}</button>`).join('');

  document.getElementById('moduleArea').innerHTML='';
}

async function restore(){
  if(!apiConfigured()){
    document.getElementById('apiWarning').classList.remove('hidden');
    return;
  }
  if(!token) return;

  const cachedMe=cacheGet('me');
  const cachedCommittees=cacheGet('committees');

  if(cachedCommittees) window.BTO_COMMITTEES_CACHE=cachedCommittees;

  // Instant UI from last successful session.
  if(cachedMe){
    me=cachedMe;
    renderApp();
    setStatus('Opening cached data… refreshing in background');
  }

  // Verify session and refresh without blocking the screen.
  const r=await api('bootstrap');

  if(r.success){
    me=r.user;
    window.BTO_COMMITTEES_CACHE=r.committees||window.BTO_COMMITTEES_CACHE||[];
    cacheSet('me',me);
    cacheSet('committees',window.BTO_COMMITTEES_CACHE);
    renderApp();
    setStatus('Connected to Barangay backend');
  }else{
    localStorage.removeItem('btoToken');
    cacheRemove('me');
    token='';
    me=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
  }
}

async function openModule(name){
  document.getElementById('moduleArea').innerHTML='<div class="card">Loading...</div>';
  if(name==='stats') return loadStats();
  if(name==='livestock') return loadLivestock();
  if(name==='content') return contentForm();
  if(name==='officials') return officialsForm();
  if(name==='assignments') return assignmentForm();
  if(name==='users') return usersForm();
  if(name==='committeeProfiles') return committeeProfilesPicker();
  if(name.startsWith('committee:')) return openCommittee(name.split(':')[1]);
}

async function loadStats(){
  const r=await api('getBarangayStats');
  if(!r.success){showModuleError(r.message);return}

  document.getElementById('moduleArea').innerHTML=
    `<div class="card"><h2>Barangay Statistics</h2>${r.data.map(x=>`
      <label>${esc(x.Label)}</label>
      <input id="s_${x['Stat Key']}" value="${esc(x.Value)}" type="number">
      <button onclick="saveStat('${x['Stat Key']}')">Save ${esc(x.Label)}</button>
      <hr>`).join('')}</div>`;
}

async function saveStat(key){
  const value=document.getElementById('s_'+key).value;
  const r=await api('saveBarangayStat',{
    statKey:key,
    value,
    asOfDate:new Date().toISOString().slice(0,10)
  });
  alert(r.success?'Saved':r.message);
}

async function loadLivestock(){
  const r=await api('getLivestockStats');
  if(!r.success){showModuleError(r.message);return}

  document.getElementById('moduleArea').innerHTML=
    `<div class="card"><h2>Livestock Statistics</h2>${r.data.map(x=>`
      <label>${esc(x.Animal)}</label>
      <input id="l_${x['Livestock Key']}" value="${esc(x.Count)}" type="number">
      <button onclick="saveLivestock('${x['Livestock Key']}')">Save ${esc(x.Animal)}</button>
      <hr>`).join('')}</div>`;
}

async function saveLivestock(key){
  const count=document.getElementById('l_'+key).value;
  const r=await api('saveLivestockStat',{
    livestockKey:key,
    count,
    asOfDate:new Date().toISOString().slice(0,10)
  });
  alert(r.success?'Saved':r.message);
}

async function contentForm(){
  let list=window.BTO_COMMITTEES_CACHE||[];
  if(!list.length){
    const committees=await api('getCommittees');
    list=committees.success ? committees.data : [];
    if(committees.success) window.BTO_COMMITTEES_CACHE=list;
  }

  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <h2>Add Announcement / Activity</h2>
      <label>Type</label>
      <select id="cType"><option>ANNOUNCEMENT</option><option>ACTIVITY</option></select>
      <label>Title</label><input id="cTitle">
      <div class="grid">
        <div><label>Date</label><input id="cDate" type="date"></div>
        <div><label>Time</label><input id="cTime" type="time"></div>
      </div>
      <label>Venue</label><input id="cVenue">
      <label>Related Committee</label>
      <select id="cCommittee">
        <option value="">General / No Committee</option>
        ${list.map(c=>`<option value="${esc(c.committeeId)}">${esc(c.committeeName)}</option>`).join('')}
      </select>
      <label>Description</label><textarea id="cDesc"></textarea>
      <label>Featured Photo</label><input id="cPhoto" type="file" accept="image/*">
      <button onclick="saveContent()">Save & Publish</button>
    </div>`;
}

async function saveContent(){
  let photoUrl='';
  const file=document.getElementById('cPhoto').files[0];

  if(file){
    const base64=await fileToBase64(file);
    const u=await api('uploadBase64',{fileName:file.name,mimeType:file.type,base64});
    if(!u.success){alert(u.message);return}
    photoUrl=u.url;
  }

  const r=await api('saveContent',{
    type:document.getElementById('cType').value,
    title:document.getElementById('cTitle').value,
    eventDate:document.getElementById('cDate').value,
    time:document.getElementById('cTime').value,
    venue:document.getElementById('cVenue').value,
    committeeId:document.getElementById('cCommittee').value,
    description:document.getElementById('cDesc').value,
    featuredPhotoUrl:photoUrl,
    status:'PUBLISHED'
  });
  alert(r.success?'Published':r.message);
}

function officialsForm(){
  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <h2>Add / Update Official</h2>
      <label>Official ID (leave blank for new)</label><input id="oId">
      <label>Full Name</label><input id="oName">
      <label>Position</label><input id="oPosition">
      <label>Group</label>
      <select id="oGroup"><option>BARANGAY</option><option>SK</option><option>TANOD</option><option>STAFF</option></select>
      <label>Contact Number (optional)</label><input id="oContact">
      <label>Status</label><select id="oStatus"><option>ACTIVE</option><option>INACTIVE</option></select>
      <label>Photo</label><input id="oPhoto" type="file" accept="image/*">
      <button onclick="saveOfficial()">Save Official</button>
    </div>`;
}

async function saveOfficial(){
  let photoUrl='';
  const file=document.getElementById('oPhoto').files[0];

  if(file){
    const base64=await fileToBase64(file);
    const u=await api('uploadBase64',{fileName:file.name,mimeType:file.type,base64});
    if(!u.success){alert(u.message);return}
    photoUrl=u.url;
  }

  const r=await api('saveOfficial',{
    officialId:document.getElementById('oId').value,
    fullName:document.getElementById('oName').value,
    position:document.getElementById('oPosition').value,
    group:document.getElementById('oGroup').value,
    contactNumber:document.getElementById('oContact').value,
    status:document.getElementById('oStatus').value,
    photoUrl
  });

  alert(r.success?'Saved: '+r.officialId:r.message);
}

async function assignmentForm(){
  const cached=cacheGet('assignmentBundle',2*60*1000);
  if(cached){
    renderAssignmentBundle(cached);
  }

  const bundle=await api('getAssignmentBundle');

  if(!bundle.success){
    if(!cached) showModuleError(bundle.message);
    return;
  }

  cacheSet('assignmentBundle',bundle);
  renderAssignmentBundle(bundle);
}

function renderAssignmentBundle(bundle){
  const officials=bundle.officials||[];
  const committees=bundle.committees||[];

  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <h2>Committee Assignment</h2>

      <label>Official</label>
      <select id="aOfficial">
        ${officials.map(o=>`<option value="${esc(o['Official ID'])}">${esc(o['Full Name'])}</option>`).join('')}
      </select>

      <label>Committee</label>
      <select id="aCommittee">
        ${committees.map(c=>`<option value="${esc(c.committeeId)}">${esc(c.committeeName)}</option>`).join('')}
      </select>

      <label>Role</label>
      <select id="aRole"><option>Chairperson</option><option>Vice Chairperson</option><option>Member</option></select>

      <label>Status</label>
      <select id="aStatus"><option>ACTIVE</option><option>INACTIVE</option></select>

      <button onclick="saveAssignment()">Save Assignment</button>
    </div>`;
}

async function saveAssignment(){
  const r=await api('saveCommitteeAssignment',{
    officialId:document.getElementById('aOfficial').value,
    committeeId:document.getElementById('aCommittee').value,
    role:document.getElementById('aRole').value,
    status:document.getElementById('aStatus').value
  });
  if(r.success) cacheRemove('assignmentBundle');
  alert(r.success?'Saved: '+r.assignmentId:r.message);
}

async function usersForm(){
  document.getElementById('moduleArea').innerHTML='<div class="card">Loading users...</div>';

  let bundleCached=cacheGet('usersBundle',2*60*1000);
  if(bundleCached){
    renderUsersBundle(bundleCached);
  }

  const bundle=await api('getUsersBundle');

  if(!bundle.success){
    if(!bundleCached) showModuleError(bundle.message);
    return;
  }

  cacheSet('usersBundle',bundle);
  renderUsersBundle(bundle);
  return;
}

function renderUsersBundle(bundle){
  const committees=bundle.committees||[];
  const users=bundle.users||[];

  const systemModules=[
    ['OFFICIALS','Officials Management'],
    ['BARANGAY_STATISTICS','Barangay Statistics'],
    ['LIVESTOCK','Livestock Statistics'],
    ['CONTENT','Announcements & Activities']
  ];

  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <h2>Create / Update User</h2>
      <input id="uId" type="hidden">

      <div class="grid">
        <div><label>Username</label><input id="uUsername"></div>
        <div><label>Full Name</label><input id="uName"></div>
      </div>

      <label>Password</label><input id="uPassword" type="password">
      <div class="help">Required for a new user. Leave blank when editing if password should stay unchanged.</div>

      <div class="grid">
        <div>
          <label>Role</label>
          <select id="uRole" onchange="applyRoleDefaults()">
            <option>SUPER_ADMIN</option><option>ADMIN</option><option>KAGAWAD</option><option>ENCODER</option><option>VIEWER</option>
          </select>
        </div>
        <div>
          <label>Status</label>
          <select id="uStatus"><option>ACTIVE</option><option>INACTIVE</option></select>
        </div>
      </div>

      <div class="check-section">
        <h4>System Modules</h4>
        <div class="check-grid">
          ${systemModules.map(m=>`
            <div class="check-item">
              <input type="checkbox" class="moduleCheck" id="mod_${m[0]}" value="${m[0]}">
              <label for="mod_${m[0]}">${m[1]}</label>
            </div>`).join('')}
        </div>
      </div>

      <div class="check-section">
        <h4>Assigned Committees</h4>
        <div class="help">Select the current committees assigned to the user.</div>
        <div class="check-grid">
          ${committees.map(c=>`
            <div class="check-item">
              <input type="checkbox" class="committeeCheck" id="com_${c.committeeId}" value="${esc(c.committeeId)}">
              <label for="com_${c.committeeId}">${esc(c.committeeName)}</label>
            </div>`).join('')}
        </div>
      </div>

      <div class="row">
        <button onclick="saveUser()">Save User</button>
        <button class="secondary" onclick="clearUserForm()">Clear</button>
      </div>
    </div>

    <div class="card">
      <h2>Existing Users</h2>
      ${users.length ? users.map(u=>`
        <div class="user-row">
          <div>
            <strong>${esc(u.fullName||u.username)}</strong>
            <small>${esc(u.username)} · ${esc(u.role)} · ${esc(u.status)}</small>
            <small>Access: ${esc(u.assignedModules||'None')}</small>
          </div>
          <button onclick='editUser(${JSON.stringify(u)})'>Edit</button>
        </div>`).join('') : '<p>No users found.</p>'}
    </div>`;

  document.getElementById('uRole').value='KAGAWAD';
  applyRoleDefaults();
}

function selectedAccess(){
  return [
    ...Array.from(document.querySelectorAll('.moduleCheck:checked')).map(x=>x.value),
    ...Array.from(document.querySelectorAll('.committeeCheck:checked')).map(x=>x.value)
  ];
}

function applyRoleDefaults(){
  const role=document.getElementById('uRole').value;
  if(role==='SUPER_ADMIN'||role==='ADMIN'){
    document.querySelectorAll('.moduleCheck,.committeeCheck').forEach(x=>x.checked=false);
    return;
  }
  if(role==='KAGAWAD'){
    const c=document.getElementById('mod_CONTENT');
    if(c)c.checked=true;
  }
}

function clearUserForm(){
  document.getElementById('uId').value='';
  document.getElementById('uUsername').value='';
  document.getElementById('uPassword').value='';
  document.getElementById('uName').value='';
  document.getElementById('uRole').value='KAGAWAD';
  document.getElementById('uStatus').value='ACTIVE';
  document.querySelectorAll('.moduleCheck,.committeeCheck').forEach(x=>x.checked=false);
  applyRoleDefaults();
}

function editUser(u){
  document.getElementById('uId').value=u.userId||'';
  document.getElementById('uUsername').value=u.username||'';
  document.getElementById('uPassword').value='';
  document.getElementById('uName').value=u.fullName||'';
  document.getElementById('uRole').value=u.role||'ENCODER';
  document.getElementById('uStatus').value=u.status||'ACTIVE';

  document.querySelectorAll('.moduleCheck,.committeeCheck').forEach(x=>x.checked=false);
  const access=String(u.assignedModules||'').split(',').map(x=>x.trim()).filter(Boolean);

  access.forEach(a=>{
    document.querySelectorAll('.moduleCheck,.committeeCheck').forEach(el=>{
      if(el.value===a)el.checked=true;
    });
  });

  window.scrollTo({top:document.getElementById('moduleArea').offsetTop,behavior:'smooth'});
}

async function saveUser(){
  const role=document.getElementById('uRole').value;
  const access=selectedAccess();

  let assignedModules='';
  if(role==='SUPER_ADMIN'||role==='ADMIN') assignedModules='ALL';
  else assignedModules=access.join(',');

  const payload={
    userId:document.getElementById('uId').value,
    username:document.getElementById('uUsername').value.trim(),
    password:document.getElementById('uPassword').value,
    fullName:document.getElementById('uName').value.trim(),
    role,
    assignedModules,
    status:document.getElementById('uStatus').value
  };

  if(!payload.username||!payload.fullName){
    alert('Username and Full Name are required.');
    return;
  }

  const r=await api('saveUser',payload);
  if(!r.success){alert(r.message);return}

  cacheRemove('usersBundle');
  alert('User saved successfully.');
  usersForm();
}


function committeeProfilesPicker(){
  const list=window.BTO_COMMITTEES_CACHE||[];
  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <h2>Committee Profiles</h2>
      <p class="help">Select a committee to manage its public profile.</p>
      <div class="committee-picker">
        ${list.map(c=>`<button onclick="openCommittee('${esc(c.committeeId)}')">${esc(c.committeeName)}</button>`).join('')}
      </div>
    </div>`;
}

let currentCommitteeId='';
let currentCommitteeData=null;
let currentCommitteeSection='STATISTIC';

async function openCommittee(committeeId){
  currentCommitteeId=committeeId;

  const cached=cacheGet('committee_'+committeeId,5*60*1000);
  if(cached){
    currentCommitteeData=cached;
    currentCommitteeSection='STATISTIC';
    renderCommitteeWorkspace();
    setStatus('Showing cached committee data… refreshing');
  }else{
    document.getElementById('moduleArea').innerHTML='<div class="card">Loading committee profile...</div>';
  }

  const r=await api('getCommitteeWorkspace',{committeeId});
  if(!r.success){
    if(!cached) showModuleError(r.message);
    return;
  }

  currentCommitteeData=r;
  cacheSet('committee_'+committeeId,r);
  currentCommitteeSection='STATISTIC';
  renderCommitteeWorkspace();
  setStatus('Connected to Barangay backend');
}

function renderCommitteeWorkspace(){
  const c=currentCommitteeData.committee;
  const entries=currentCommitteeData.entries||[];
  const content=currentCommitteeData.content||[];

  const stats=entries.filter(x=>x.Section==='STATISTIC' && String(x.Status).toUpperCase()==='ACTIVE');

  document.getElementById('moduleArea').innerHTML=`
    <div class="card">
      <div class="committee-head">
        <div>
          <h2 style="margin-bottom:4px">${esc(c.committeeName)}</h2>
          <div class="help">Committee Profile Management</div>
        </div>
        <button class="light" onclick="refreshCommittee()">Refresh</button>
      </div>

      ${stats.length ? `
      <div class="stat-grid">
        ${stats.slice(0,6).map(s=>`
          <div class="stat-box">
            <small>${esc(s.Title)}</small>
            <strong>${esc(s.Value || '—')} ${esc(s.Unit || '')}</strong>
            <small>As of ${esc(s['As Of Date'] || '—')}</small>
          </div>`).join('')}
      </div>` : ''}

      <div class="section-tabs">
        ${[
          ['STATISTIC','Statistics'],
          ['ORGANIZATION','Organizations'],
          ['SERVICE','Services'],
          ['PROGRAM','Programs & Projects'],
          ['ACTIVITY','Activities'],
          ['REPORT','Reports / Documents']
        ].map(x=>`<button class="${currentCommitteeSection===x[0]?'active':''}" onclick="setCommitteeSection('${x[0]}')">${x[1]}</button>`).join('')}
      </div>

      <div id="committeeSectionBody"></div>
    </div>`;

  renderCommitteeSectionBody(entries,content);
}

function setCommitteeSection(section){
  currentCommitteeSection=section;
  renderCommitteeWorkspace();
}

function renderCommitteeSectionBody(entries,content){
  const body=document.getElementById('committeeSectionBody');

  if(currentCommitteeSection==='ACTIVITY'){
    const today=new Date(); today.setHours(0,0,0,0);
    const rows=content.slice().sort((a,b)=>String(b['Event Date']||'').localeCompare(String(a['Event Date']||'')));

    const upcoming=rows.filter(x=>{
      if(!x['Event Date']) return false;
      const d=new Date(x['Event Date']); d.setHours(0,0,0,0);
      return d>=today;
    });
    const recent=rows.filter(x=>{
      if(!x['Event Date']) return true;
      const d=new Date(x['Event Date']); d.setHours(0,0,0,0);
      return d<today;
    });

    body.innerHTML=`
      <h3>Upcoming Activities / Announcements</h3>
      ${renderCommitteeContentRows(upcoming)}
      <h3 style="margin-top:18px">Recent Activities</h3>
      ${renderCommitteeContentRows(recent)}
      <button onclick="openCommitteeQuickActivity()">Add Committee Activity / Announcement</button>`;
    return;
  }

  const sectionEntries=entries.filter(x=>
    String(x.Section).toUpperCase()===currentCommitteeSection &&
    String(x.Status).toUpperCase()!=='DELETED'
  );

  body.innerHTML=`
    <div id="committeeEntryForm">${committeeEntryFormHtml()}</div>
    <hr>
    <h3>Existing ${committeeSectionLabel(currentCommitteeSection)}</h3>
    ${sectionEntries.length ? sectionEntries.map(renderCommitteeEntry).join('') : '<p class="help">No records yet.</p>'}`;
}

function committeeSectionLabel(section){
  return ({
    STATISTIC:'Statistics',
    ORGANIZATION:'Organizations / Associations',
    SERVICE:'Services',
    PROGRAM:'Programs & Projects',
    REPORT:'Reports / Documents'
  })[section] || section;
}

function committeeEntryFormHtml(entry={}){
  const section=currentCommitteeSection;
  const isStat=section==='STATISTIC';
  const isReport=section==='REPORT';

  return `
    <h3>${entry['Entry ID']?'Edit':'Add'} ${committeeSectionLabel(section)}</h3>
    <input id="cpEntryId" type="hidden" value="${esc(entry['Entry ID']||'')}">

    <label>Title</label>
    <input id="cpTitle" value="${esc(entry.Title||'')}" placeholder="${isStat?'Example: Registered Farmers':'Title'}">

    ${isStat ? `
      <div class="grid">
        <div><label>Value</label><input id="cpValue" value="${esc(entry.Value||'')}"></div>
        <div><label>Unit</label><input id="cpUnit" value="${esc(entry.Unit||'')}" placeholder="persons, heads, households..."></div>
      </div>
      <label>As Of Date</label>
      <input id="cpAsOf" type="date" value="${dateInputValue(entry['As Of Date'])}">
    ` : ''}

    <label>Description</label>
    <textarea id="cpDescription">${esc(entry.Description||'')}</textarea>

    ${isReport ? `
      <label>Document / Report File</label>
      <input id="cpFile" type="file">
      <div class="help">You may upload a PDF/image/document, or paste an existing URL below.</div>
    ` : ''}

    <label>${isReport?'File / Document URL':'Link URL (optional)'}</label>
    <input id="cpLink" value="${esc(entry['Link URL']||'')}">

    <div class="grid">
      <div>
        <label>Status</label>
        <select id="cpStatus">
          <option ${String(entry.Status||'ACTIVE')==='ACTIVE'?'selected':''}>ACTIVE</option>
          <option ${String(entry.Status)==='INACTIVE'?'selected':''}>INACTIVE</option>
        </select>
      </div>
      <div>
        <label>Sort Order</label>
        <input id="cpSort" type="number" value="${esc(entry['Sort Order']||0)}">
      </div>
    </div>

    <div class="row">
      <button onclick="saveCommitteeEntry()">Save</button>
      ${entry['Entry ID']?'<button class="secondary" onclick="cancelCommitteeEdit()">Cancel</button>':''}
    </div>`;
}

function renderCommitteeEntry(e){
  const extra=[];
  if(e.Value) extra.push(`${esc(e.Value)} ${esc(e.Unit||'')}`);
  if(e['As Of Date']) extra.push(`As of ${esc(e['As Of Date'])}`);

  return `
    <div class="entry-card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h4>${esc(e.Title||'(Untitled)')}</h4>
          ${extra.length?`<p><strong>${extra.join(' · ')}</strong></p>`:''}
          ${e.Description?`<p>${esc(e.Description)}</p>`:''}
          ${e['Link URL']?`<p><a href="${esc(e['Link URL'])}" target="_blank">Open link/document</a></p>`:''}
          <small>${esc(e.Status||'')}</small>
        </div>
        <div class="row">
          <button onclick='editCommitteeEntry(${JSON.stringify(e)})'>Edit</button>
          <button class="secondary" onclick="deleteCommitteeEntry('${esc(e['Entry ID'])}')">Delete</button>
        </div>
      </div>
    </div>`;
}

function editCommitteeEntry(e){
  document.getElementById('committeeEntryForm').innerHTML=committeeEntryFormHtml(e);
  document.getElementById('committeeEntryForm').scrollIntoView({behavior:'smooth'});
}

function cancelCommitteeEdit(){
  document.getElementById('committeeEntryForm').innerHTML=committeeEntryFormHtml();
}

async function saveCommitteeEntry(){
  let linkUrl=document.getElementById('cpLink').value.trim();
  const file=document.getElementById('cpFile')?.files?.[0];

  if(file){
    const base64=await fileToBase64(file);
    const up=await api('uploadBase64',{fileName:file.name,mimeType:file.type||'application/octet-stream',base64});
    if(!up.success){alert(up.message);return}
    linkUrl=up.url;
  }

  const data={
    entryId:document.getElementById('cpEntryId').value,
    committeeId:currentCommitteeId,
    section:currentCommitteeSection,
    title:document.getElementById('cpTitle').value.trim(),
    value:document.getElementById('cpValue')?.value || '',
    unit:document.getElementById('cpUnit')?.value || '',
    description:document.getElementById('cpDescription').value.trim(),
    linkUrl,
    status:document.getElementById('cpStatus').value,
    sortOrder:document.getElementById('cpSort').value,
    asOfDate:document.getElementById('cpAsOf')?.value || ''
  };

  if(!data.title){alert('Title is required.');return}

  const r=await api('saveCommitteeProfileEntry',data);
  if(!r.success){alert(r.message);return}

  await refreshCommittee();
}

async function deleteCommitteeEntry(entryId){
  if(!confirm('Delete this committee profile entry?')) return;
  const r=await api('deleteCommitteeProfileEntry',{committeeId:currentCommitteeId,entryId});
  if(!r.success){alert(r.message);return}
  await refreshCommittee();
}

async function refreshCommittee(){
  const r=await api('getCommitteeWorkspace',{committeeId:currentCommitteeId});
  if(!r.success){showModuleError(r.message);return}
  currentCommitteeData=r;
  cacheSet('committee_'+currentCommitteeId,r);
  renderCommitteeWorkspace();
}

function renderCommitteeContentRows(rows){
  if(!rows.length) return '<p class="help">No records yet.</p>';
  return rows.map(x=>`
    <div class="entry-card">
      <h4>${esc(x.Title||'')}</h4>
      <p>${esc(x.Type||'')} ${x['Event Date']?'· '+esc(x['Event Date']):''} ${x.Time?'· '+esc(x.Time):''}</p>
      ${x.Venue?`<p>Venue: ${esc(x.Venue)}</p>`:''}
      ${x.Description?`<p>${esc(x.Description)}</p>`:''}
    </div>`).join('');
}

function openCommitteeQuickActivity(){
  const c=currentCommitteeData.committee;
  document.getElementById('committeeSectionBody').innerHTML=`
    <h3>Add Activity / Announcement</h3>
    <label>Type</label>
    <select id="qaType"><option>ACTIVITY</option><option>ANNOUNCEMENT</option></select>
    <label>Title</label><input id="qaTitle">
    <div class="grid">
      <div><label>Date</label><input id="qaDate" type="date"></div>
      <div><label>Time</label><input id="qaTime" type="time"></div>
    </div>
    <label>Venue</label><input id="qaVenue">
    <label>Description</label><textarea id="qaDesc"></textarea>
    <label>Featured Photo</label><input id="qaPhoto" type="file" accept="image/*">
    <div class="row">
      <button onclick="saveCommitteeQuickActivity()">Save & Publish</button>
      <button class="secondary" onclick="setCommitteeSection('ACTIVITY')">Cancel</button>
    </div>`;
}

async function saveCommitteeQuickActivity(){
  let photoUrl='';
  const file=document.getElementById('qaPhoto').files[0];

  if(file){
    const base64=await fileToBase64(file);
    const u=await api('uploadBase64',{fileName:file.name,mimeType:file.type,base64});
    if(!u.success){alert(u.message);return}
    photoUrl=u.url;
  }

  const r=await api('saveContent',{
    type:document.getElementById('qaType').value,
    title:document.getElementById('qaTitle').value.trim(),
    eventDate:document.getElementById('qaDate').value,
    time:document.getElementById('qaTime').value,
    venue:document.getElementById('qaVenue').value.trim(),
    committeeId:currentCommitteeId,
    description:document.getElementById('qaDesc').value.trim(),
    featuredPhotoUrl:photoUrl,
    status:'PUBLISHED'
  });

  if(!r.success){alert(r.message);return}
  await refreshCommittee();
  currentCommitteeSection='ACTIVITY';
  renderCommitteeWorkspace();
}

function dateInputValue(v){
  if(!v) return '';
  if(typeof v==='string') return v.slice(0,10);
  try{
    const d=new Date(v);
    if(isNaN(d)) return '';
    return d.toISOString().slice(0,10);
  }catch(e){return ''}
}

function showModuleError(message){
  document.getElementById('moduleArea').innerHTML=
    '<div class="card"><div class="msg err">'+esc(message)+'</div></div>';
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

restore();
</script>
