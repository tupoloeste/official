<style>
:root{

  --border:#e5e7eb;--text:#202124;--muted:#6b7280;--shadow:0 8px 28px rgba(0,0,0,.06)

*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:18px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand-logo{width:54px;height:54px;object-fit:contain;border-radius:50%;background:#fff;flex:0 0 auto}
.brand strong{display:block;font-size:17px}
.brand small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}
h2,h3{margin-top:0}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;
  margin:5px 0 11px;background:#fff;font:inherit
}
textarea{min-height:100px;resize:vertical}
button{
  border:0;background:var(--red);color:#fff;padding:10px 14px;border-radius:9px;
  font-weight:800;cursor:pointer
}
button:hover{background:var(--red-dark)}
button.secondary{background:#333}
button.light{background:#fff;color:#333;border:1px solid #ddd}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{min-height:84px}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:10px;border-radius:8px;margin:10px 0}
.err{background:#fff0f3;color:#9f1239}

.help{font-size:12px;color:var(--muted);margin-top:-5px;margin-bottom:10px}

.check-item input{width:auto;margin:2px 0 0}
.check-item label{margin:0;font-size:13px;cursor:pointer}
.user-row,.record-row{
  border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;
  display:flex;justify-content:space-between;gap:10px;align-items:center

/* ===== Subtle portal animations ===== */
@keyframes btoFadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes btoScaleIn{
  from{opacity:0;transform:scale(.985)}
  to{opacity:1;transform:scale(1)}
}
@keyframes btoPulse{
  0%,100%{opacity:.45}
  50%{opacity:1}
}
@keyframes btoSpin{
  to{transform:rotate(360deg)}
}

.topbar,
#dashboardView > .card,
#moduleView > .card,
#loginCard{
  animation:btoFadeUp .38s ease both;
}

.menu button{
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  animation:btoFadeUp .38s ease both;
}
.menu button:nth-child(1){animation-delay:.03s}
.menu button:nth-child(2){animation-delay:.07s}
.menu button:nth-child(3){animation-delay:.11s}
.menu button:nth-child(4){animation-delay:.15s}
.menu button:nth-child(5){animation-delay:.19s}
.menu button:nth-child(6){animation-delay:.23s}
.menu button:nth-child(7){animation-delay:.27s}
.menu button:nth-child(8){animation-delay:.31s}

.menu button:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(0,0,0,.10);
  filter:brightness(.98);
}
.menu button:active{
  transform:translateY(-1px) scale(.99);
}

button{
  transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
}
button:hover{

}
button:active{

}

#moduleView:not(.hidden){

.entry-card,
.stat-box,

}

.bto-loading{

.user-avatar{

}
.user-avatar:hover{

}


@keyframes btoLogoFloat{
  0%{transform:translateY(0) rotate(0deg) scale(1)}
  25%{transform:translateY(-2px) rotate(-1deg) scale(1.015)}
  50%{transform:translateY(-4px) rotate(0deg) scale(1.025)}
  75%{transform:translateY(-2px) rotate(1deg) scale(1.015)}
  100%{transform:translateY(0) rotate(0deg) scale(1)}
}

.brand-logo{

.brand-logo:hover{

input,select,textarea{

<script>

let btoProcessDepth=0;
let btoProcessHideTimer=null;

function showProcessModal(title='Saving...',sub='Please wait while your changes are being processed.'){
  const modal=document.getElementById('btoProcessModal');
  const titleEl=document.getElementById('btoProcessTitle');
  const subEl=document.getElementById('btoProcessSub');
  if(!modal) return;

  clearTimeout(btoProcessHideTimer);
  btoProcessDepth++;

  if(titleEl) titleEl.textContent=title;
  if(subEl) subEl.textContent=sub;

  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.classList.add('bto-processing');
}

function updateProcessModal(title,sub){
  const titleEl=document.getElementById('btoProcessTitle');
  const subEl=document.getElementById('btoProcessSub');
  if(title && titleEl) titleEl.textContent=title;
  if(sub !== undefined && subEl) subEl.textContent=sub;
}

function hideProcessModal(force=false){
  if(force) btoProcessDepth=0;
  else btoProcessDepth=Math.max(0,btoProcessDepth-1);

  if(btoProcessDepth>0) return;

  clearTimeout(btoProcessHideTimer);
  btoProcessHideTimer=setTimeout(()=>{
    const modal=document.getElementById('btoProcessModal');
    if(modal){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
    }
    document.body.classList.remove('bto-processing');
  },120);
}

function apiActionModalText(action){
  const a=String(action||'').toLowerCase();
  if(a.includes('upload')) return ['Uploading...','Uploading file. Please wait.'];
  if(a.includes('delete')) return ['Deleting...','Removing the selected record.'];
  if(a.includes('reject')) return ['Rejecting...','Updating the record status.'];
  if(a.includes('approve')) return ['Approving...','Updating the record status.'];
  if(a.includes('login')) return ['Signing in...','Connecting to the Barangay backend.'];
  if(a.includes('save') || a.includes('update') || a.includes('record') || a.includes('assign')){
    return ['Saving...','Saving your changes. Please wait.'];
  }
  return null;
}

function isWriteApiAction(action){
  const a=String(action||'').toLowerCase();
  return /^(save|update|delete|upload|approve|reject|record|assign)/.test(a) ||
         a.includes('save') || a.includes('delete') || a.includes('upload');
}

function ensureGlobalActionStatus(){
  let el=document.getElementById('globalActionStatus');
  if(!el){
    el=document.createElement('div');
    el.id='globalActionStatus';
    el.className='global-action-status';
    document.body.appendChild(el);
  }
  return el;
}

function showGlobalActionStatus(message,type=''){
  const el=ensureGlobalActionStatus();
  el.textContent=message||'';
  el.className='global-action-status show'+(type?' '+type:'');
  clearTimeout(showGlobalActionStatus._t);
  showGlobalActionStatus._t=setTimeout(()=>{
    el.classList.remove('show');
  },2600);
}

function setBusyButton(btn,busy,label){
  if(!btn) return;

  if(busy){
    if(!btn.dataset.originalHtml) btn.dataset.originalHtml=btn.innerHTML;
    btn.disabled=true;
    btn.classList.add('is-busy');
    btn.innerHTML=`<span class="btn-spinner"></span>${label||'Saving...'}`;
  }else{
    btn.disabled=false;
    btn.classList.remove('is-busy');
    if(btn.dataset.originalHtml){
      btn.innerHTML=btn.dataset.originalHtml;
      delete btn.dataset.originalHtml;
    }
  }
}

async function withButtonSpinner(btnOrEvent,label,fn,successMessage){
  const btn = btnOrEvent instanceof HTMLElement
    ? btnOrEvent
    : (btnOrEvent?.currentTarget || null);

  if(btn?.classList?.contains('is-busy')) return;

  setBusyButton(btn,true,label||'Saving...');

  try{
    const result=await fn();

    if(result && result.success===false){
      throw new Error(result.message || 'Action failed.');
    }

    if(successMessage){
      showGlobalActionStatus(successMessage,'ok');
    }

    return result;
  }catch(err){
    showGlobalActionStatus(err?.message || 'Action failed.','err');
    throw err;
  }finally{
    setBusyButton(btn,false);
    // Safety release: document upload/save sequences may involve multiple API calls.
    hideProcessModal(true);
  }
}

   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwM6bagjlHKao-NCB3d_nDwX29zO4EFKcoj50vABCQP7bKJuSI4j7772Zam9LwNiLCqNg/exec';

let token = localStorage.getItem('btoToken') || '';
let me = null;


const BTO_CACHE_TTL = 30 * 60 * 1000; // 30 minutes

function cacheSet(key,value){
  try{
    localStorage.setItem('bto_cache_'+key,JSON.stringify({
      savedAt:Date.now(),
      value:value
    }));
  }catch(e){}
}

function cacheGet(key,maxAge=BTO_CACHE_TTL){
  try{
    const raw=localStorage.getItem('bto_cache_'+key);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || !obj.savedAt) return null;
    if(Date.now()-obj.savedAt > maxAge) return null;
    return obj.value;
  }catch(e){
    return null;
  }
}

function cacheRemove(key){
  try{localStorage.removeItem('bto_cache_'+key)}catch(e){}
}

function setStatus(text){
  // Status bar intentionally hidden for a cleaner portal UI.
}

function apiConfigured(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API_URL);
}

async function api(action,data={}){
  if(!apiConfigured()){
    return {success:false,message:'Apps Script API URL is not configured.'};
  }

  const payload={action,token,data};

  if(action==='login'){
    payload.username=data.username || '';
    payload.password=data.password || '';
  }

  const controller=new AbortController();
  const timeoutMs =
    action==='uploadBase64' ? 120000 :
    (action==='saveLegislative' || action==='saveFullDisclosure' || action==='saveDisclosureCategory') ? 45000 :
    20000;
  const timeout=setTimeout(()=>controller.abort(),timeoutMs);

  const modalText=apiActionModalText(action);
  const useModal=isWriteApiAction(action) || action==='login';

  if(useModal && modalText){
    showProcessModal(modalText[0],modalText[1]);
  }

  const started=Date.now();
  console.log('[BTO API] START',action);

  try{
    const response=await fetch(API_URL,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),
      signal:controller.signal,
      cache:'no-store'
    });

    const text=await response.text();
    console.log('[BTO API] RESPONSE',action,response.status,(Date.now()-started)+'ms');

    try{
      return JSON.parse(text);
    }catch(e){
      console.error('[BTO API] NON-JSON',action,text.slice(0,300));
      const looksHtml=/^\s*<!doctype|^\s*<html/i.test(text||'');
      return {
        success:false,
        nonJson:true,
        httpStatus:response.status,
        message: looksHtml
          ? 'Google/Apps Script returned an HTML error page instead of API data. The upload may be too large, the request may have timed out on Google, or the latest Apps Script deployment is not active.'
          : 'Backend returned an invalid response. Please try again.'
      };
    }

  }catch(err){
    if(err && err.name==='AbortError'){
      console.error('[BTO API] TIMEOUT',action,timeoutMs+'ms');
      return {
        success:false,
        message:'Barangay backend did not respond within the allowed time. Check the Apps Script Web App deployment, then try again.'
      };
    }

    console.error('[BTO API] ERROR',action,err);
    return {success:false,message:err?.message || String(err)};

  }finally{
    clearTimeout(timeout);
    if(useModal) hideProcessModal();
  }
}

async function login(triggerBtn){
  const btn=triggerBtn || document.getElementById('loginBtn');
  const msg=document.getElementById('loginMsg');

  if(btn?.classList?.contains('is-busy')) return;

  setBusyButton(btn,true,'Signing in...');
  if(msg) msg.innerHTML='';

  try{
    const r=await api('login',{
      username:document.getElementById('username').value.trim(),
      password:document.getElementById('password').value
    });

    if(!r.success){
      if(msg) msg.innerHTML='<div class="msg err">'+esc(r.message)+'</div>';
      return;
    }

    token=r.token;
    me=r.user;
    localStorage.setItem('btoToken',token);
    cacheSet('me',me);

    renderApp();

    api('getCommittees').then(c=>{
      if(c && c.success){
        window.BTO_COMMITTEES_CACHE=c.data||[];
        cacheSet('committees',window.BTO_COMMITTEES_CACHE);
        renderApp();
      }
    }).catch(()=>{});

  }catch(err){
    if(msg) msg.innerHTML='<div class="msg err">'+esc(err?.message || 'Login failed.')+'</div>';
    showGlobalActionStatus(err?.message || 'Login failed.','err');
  }finally{
    setBusyButton(btn,false);
  }
}

function hasModule(name){
  if(!me) return false;
  if(['SUPER_ADMIN','ADMIN'].includes(me.role)) return true;
  const mods=(me.assignedModules||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
  return mods.includes('ALL') || mods.includes(name.toUpperCase());
}

function renderApp(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  const displayName=me.fullName || me.username || 'User';
  document.getElementById('who').textContent=displayName;

  let positionLabel='';
  if(me.role==='SUPER_ADMIN') positionLabel='System Administrator';
  else if(me.role==='ADMIN') positionLabel='Administrator';
  else if(me.role==='KAGAWAD') positionLabel='Barangay Kagawad';
  else if(me.role==='ENCODER') positionLabel='Authorized Encoder';
  else positionLabel=me.role || '';

  document.getElementById('role').textContent=positionLabel;
  document.getElementById('userAvatar').textContent=(displayName.trim().charAt(0)||'U').toUpperCase();

  const items=[];
  if(hasModule('OFFICIALS')) items.push(['Officials','officials']);

  if(['SUPER_ADMIN','ADMIN'].includes(me.role))
    items.push(['Committee Assignments','assignments']);

  if(hasModule('ABOUT_BARANGAY')) items.push(['About Barangay','aboutBarangay']);
  if(hasModule('BARANGAY_STATISTICS')) items.push(['Barangay Statistics','stats']);
  if(hasModule('LIVESTOCK')) items.push(['Livestock Statistics','livestock']);

  if(hasModule('CONTENT') || (me.assignedModules||'').includes('COM-'))
    items.push(['Announcements & Activities','content']);

  if(hasModule('LEGISLATIVE'))
    items.push(['Ordinances & Resolutions','legislative']);

  if(hasModule('FULL_DISCLOSURE'))
    items.push(['Barangay Full Disclosure','fullDisclosure']);

  if(['SUPER_ADMIN','ADMIN'].includes(me.role)){
    items.push(['Users','users']);
    items.push(['Site Media','siteMedia']);
    items.push(['Committees Management','committees']);
  }

  const committees=window.BTO_COMMITTEES_CACHE||[];

  if(['SUPER_ADMIN','ADMIN'].includes(me.role)){
    items.push(['Committee Profiles','committeeProfiles']);
  }else{
    const allowed=String(me.assignedModules||'')
      .split(',').map(x=>x.trim().toUpperCase()).filter(x=>x.startsWith('COM-'));

    committees
      .filter(c=>allowed.includes(String(c.committeeId).toUpperCase()))
      .forEach(c=>items.push([c.committeeName,'committee:'+c.committeeId]));
  }

  document.getElementById('moduleMenu').innerHTML=
    items.map(i=>`<button onclick="openModule('${i[1]}','${esc(i[0])}')">${esc(i[0])}</button>`).join('');

  // Always return to clean dashboard after login/refresh.
  document.getElementById('dashboardView').classList.remove('hidden');
  document.getElementById('moduleView').classList.add('hidden');
  document.getElementById('moduleArea').innerHTML='';
}

async function restore(){
  if(!apiConfigured()){
    document.getElementById('apiWarning').classList.remove('hidden');
    return;
  }
  if(!token) return;

  const cachedMe=cacheGet('me');
  const cachedCommittees=cacheGet('committees');

  if(cachedCommittees) window.BTO_COMMITTEES_CACHE=cachedCommittees;

  // Instant UI from last successful session.
  if(cachedMe){
    me=cachedMe;
    renderApp();
    setStatus('Opening cached data… refreshing in background');
  }

  // Verify session and refresh without blocking the screen.
  const r=await api('bootstrap');

  if(r.success){
    me=r.user;
    window.BTO_COMMITTEES_CACHE=r.committees||window.BTO_COMMITTEES_CACHE||[];
    cacheSet('me',me);
    cacheSet('committees',window.BTO_COMMITTEES_CACHE);
    renderApp();
    }else{
    localStorage.removeItem('btoToken');
    cacheRemove('me');
    token='';
    me=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
  }
}

async function saveAboutBarangay(btn){
  return withButtonSpinner(btn,'Saving...',async()=>{

    const file=document.getElementById('abMapImage').files[0];

    if(file){
      const base64=await fileToBase64(file);
      const u=await api('uploadBase64',{
        fileName:file.name,
        mimeType:file.type||'image/jpeg',
        base64
      });
      if(!u.success) throw new Error(u.message||'Map image upload failed.');
      mapImageUrl=u.url||'';
    }

    const current=await api('getAboutBarangay');
    if(!current.success) throw new Error(current.message||'Unable to read current About Barangay data.');

    const r=await api('saveAboutBarangay',{
      overview:document.getElementById('abOverview').value,
      history:document.getElementById('abHistory').value,
      vision:document.getElementById('abVision').value,
      mission:document.getElementById('abMission').value,
      landArea:document.getElementById('abLandArea').value,
      sitiosPuroks:document.getElementById('abSitios').value,
      mapImageUrl:mapImageUrl || current.data.mapImageUrl || ''
    });

    if(!r.success) throw new Error(r.message||'Unable to save About Barangay.');
    await aboutBarangayForm();
    return r;
  },'About Barangay saved.');
}

function autoBalanceSex(changed){
  const totalEl=document.getElementById('bs_TOTAL_POPULATION');
  const maleEl=document.getElementById('bs_MALE');
  const femaleEl=document.getElementById('bs_FEMALE');
  if(!totalEl||!maleEl||!femaleEl) return;

  const total=Number(totalEl.value);
  if(!Number.isFinite(total) || total<0 || totalEl.value==='') return;

  if(changed==='MALE'){
    window.BTO_LAST_SEX_EDIT='MALE';
    const male=Number(maleEl.value);
    if(Number.isFinite(male) && male>=0){
      femaleEl.value=Math.max(0,total-male);
    }
    return;
  }

  if(changed==='FEMALE'){
    window.BTO_LAST_SEX_EDIT='FEMALE';
    const female=Number(femaleEl.value);
    if(Number.isFinite(female) && female>=0){
      maleEl.value=Math.max(0,total-female);
    }
    return;
  }

  // Total Population changed.
  // Recalculate the opposite sex based on whichever sex the user last edited.
  if(window.BTO_LAST_SEX_EDIT==='FEMALE' && femaleEl.value!==''){
    const female=Number(femaleEl.value);
    if(Number.isFinite(female) && female>=0){
      maleEl.value=Math.max(0,total-female);
      return;
    }
  }

  if(maleEl.value!==''){
    const male=Number(maleEl.value);
    if(Number.isFinite(male) && male>=0){
      femaleEl.value=Math.max(0,total-male);
      return;
    }
  }

  if(femaleEl.value!==''){
    const female=Number(femaleEl.value);
    if(Number.isFinite(female) && female>=0){
      maleEl.value=Math.max(0,total-female);
    }
  }
}

async function saveAllBarangayStats(btn){
  return withButtonSpinner(btn,'Saving All...',async()=>{
    const asOfDate=document.getElementById('statsAsOfDate').value;

    const total=numberOrBlank('bs_TOTAL_POPULATION');
    const male=numberOrBlank('bs_MALE');
    const female=numberOrBlank('bs_FEMALE');

    if(total!=='' && male!=='' && female!==''){
      if(Number(male)+Number(female)!==Number(total)){
        throw new Error('Male + Female must equal Total Population.');
      }
    }

    const core=await api('saveEnhancedStatsBatch',{
      asOfDate,
      values:{
        TOTAL_POPULATION:total,
        MALE:male,
        FEMALE:female,
        TOTAL_HOUSEHOLDS:numberOrBlank('bs_TOTAL_HOUSEHOLDS'),
        TOTAL_FAMILIES:numberOrBlank('bs_TOTAL_FAMILIES'),
        REGISTERED_VOTERS:numberOrBlank('bs_REGISTERED_VOTERS'),
        SENIOR_CITIZENS:numberOrBlank('bs_SENIOR_CITIZENS'),
        PWD:numberOrBlank('bs_PWD')
      }
    });

    if(!core.success) throw new Error(core.message||'Unable to save Barangay Statistics.');

    const demographics=await api('saveDemographicsBatch',{
      asOfDate,
      rows:collectAgeGroupRows()
    });

    if(!demographics.success) throw new Error(demographics.message||'Unable to save age groups.');

    await loadStats();

    return {
      success:true,
      message:'All Barangay Statistics saved.'
    };
  },'All Barangay Statistics saved.');
}

const BTO_OFFICIAL_POSITION_OPTIONS = {
  BARANGAY: [
    'Punong Barangay',
    'Sangguniang Barangay Member',
    'Barangay Secretary',
    'Barangay Treasurer'
  ],
  SK: [
    'SK Chairperson',
    'Sangguniang Kabataan Member'
  ],
  TANOD: [
    'Chief Tanod',
    'Barangay Tanod Member'
  ]
};

function normalizedOfficialGroup(group){
  const g=String(group||'').trim().toUpperCase();

  if(g==='SANGGUNIANG KABATAAN' || g==='SK') return 'SK';
  if(g==='BARANGAY TANOD' || g==='TANOD') return 'TANOD';
  return 'BARANGAY';
}

function updateOfficialPositionOptions(selectedValue){
  const groupEl=document.getElementById('oGroup');
  const posEl=document.getElementById('oPosition');
  if(!groupEl || !posEl) return;

  const group=normalizedOfficialGroup(groupEl.value);
  const options=BTO_OFFICIAL_POSITION_OPTIONS[group] || [];

  const current=String(
    selectedValue !== undefined ? selectedValue : posEl.value
  ).trim();

  posEl.innerHTML=
    '<option value="">Select position</option>'+
    options.map(position=>
      `<option value="${esc(position)}">${esc(position)}</option>`
    ).join('');

  if(current){
    const exact=options.find(x=>x.toUpperCase()===current.toUpperCase());
    if(exact){
      posEl.value=exact;
    }else{
      // Preserve an existing legacy position without losing data.
      const legacy=document.createElement('option');
      legacy.value=current;
      legacy.textContent=current;
      legacy.dataset.legacy='1';
      posEl.appendChild(legacy);
      posEl.value=current;
    }
  }
}

async function saveOfficial(btn){
  if(btn?.classList?.contains('is-busy')) return;

  const status=document.getElementById('officialSaveStatus');
  const fullName=document.getElementById('oName').value.trim();
  const position=document.getElementById('oPosition').value.trim();

  if(!fullName){
    alert('Full Name is required.');
    return;
  }
  if(!position){
    alert('Position is required.');
    return;
  }

  setBusyButton(btn,true,'Saving...');

  try{
    let photoUrl=document.getElementById('oExistingPhotoUrl').value.trim();
    const file=document.getElementById('oPhoto').files[0];

    if(file){
      if(status){
        status.className='save-status';
        status.textContent='Uploading photo...';
        updateProcessModal('Uploading photo...','Uploading the selected photo.');
      }

      const base64=await fileToBase64(file);
      const u=await api('uploadBase64',{
        fileName:file.name,
        mimeType:file.type||'image/jpeg',
        base64
      });
      if(!u.success) throw new Error(u.message);

      photoUrl=u.url;
    }

    if(status) status.textContent='Saving official...';
    updateProcessModal('Saving official...','Saving official information.');

    const r=await api('saveOfficial',{
      officialId:document.getElementById('oId').value.trim(),
      fullName,
      position,
      group:document.getElementById('oGroup').value,
      contactNumber:document.getElementById('oContact').value.trim(),
      status:document.getElementById('oStatus').value,
      photoUrl
    });

    if(!r.success) throw new Error(r.message);

    if(status){
      status.className='save-status ok';
      status.textContent='Official saved successfully.';
    }
    showGlobalActionStatus('Official saved successfully.','ok');

    cacheRemove('assignmentBundle');
    cacheRemove('usersBundle');

    await officialsForm();

  }catch(err){
    if(status){
      status.className='save-status err';
      status.textContent=err.message||'Save failed.';
    }
    showGlobalActionStatus(err.message||'Save failed.','err');
  }finally{
    setBusyButton(btn,false);
  }
}

function renderCommitteeSectionBody(entries,content){
  const body=document.getElementById('committeeSectionBody');

  if(currentCommitteeSection==='ACTIVITY'){
    const today=new Date(); today.setHours(0,0,0,0);
    const rows=content.slice().sort((a,b)=>String(b['Event Date']||'').localeCompare(String(a['Event Date']||'')));

    const upcoming=rows.filter(x=>{
      if(!x['Event Date']) return false;
      const d=new Date(x['Event Date']); d.setHours(0,0,0,0);
      return d>=today;
    });
    const recent=rows.filter(x=>{
      if(!x['Event Date']) return true;

async function saveCommitteeEntry(){
  if(committeeSaveInProgress) return;

  const btn=document.getElementById('cpSaveBtn');
  const status=document.getElementById('cpSaveStatus');

  committeeSaveInProgress=true;
  if(btn){
    btn.disabled=true;
    btn.classList.add('is-saving');
    btn.innerHTML='<span class="save-mini-spinner"></span> Saving...';
  }
  if(status){
    status.className='save-status';
    status.textContent='Please wait while the record is being saved.';
  }

  try{
    let linkUrl=document.getElementById('cpLink').value.trim();
    const file=document.getElementById('cpFile')?.files?.[0];

    if(file){
      if(status) status.textContent='Uploading file...';
      const base64=await fileToBase64(file);
      const up=await api('uploadBase64',{
        fileName:file.name,
        mimeType:file.type||'application/octet-stream',
        base64
      });
      if(!up.success) throw new Error(up.message);
      linkUrl=up.url;
      if(status) status.textContent='Saving record...';
    }

    const data={
      entryId:document.getElementById('cpEntryId').value,
      committeeId:currentCommitteeId,
      section:currentCommitteeSection,
      title:document.getElementById('cpTitle').value.trim(),
      value:document.getElementById('cpValue')?.value || '',
      unit:document.getElementById('cpUnit')?.value || '',
      description:document.getElementById('cpDescription').value.trim(),
      linkUrl,
      status:document.getElementById('cpStatus').value,
      sortOrder:document.getElementById('cpSort').value,
      asOfDate:document.getElementById('cpAsOf')?.value || ''
    };

    if(!data.title) throw new Error('Title is required.');

    const r=await api('saveCommitteeProfileEntry',data);
    if(!r.success) throw new Error(r.message);

    if(status){
      status.className='save-status ok';
      status.textContent='Saved successfully.';
    }

    // Small pause so the user sees the confirmation before refresh.
    await new Promise(resolve=>setTimeout(resolve,650));
    await refreshCommittee();

  }catch(err){
    if(status){
      status.className='save-status err';
      status.textContent=err.message || 'Save failed.';
    }
    alert(err.message || 'Save failed.');
  }finally{
    committeeSaveInProgress=false;
    const currentBtn=document.getElementById('cpSaveBtn');
    if(currentBtn){
      currentBtn.disabled=false;
      currentBtn.classList.remove('is-saving');
      currentBtn.textContent='Save';
    }
  }
}

async function saveCommitteeQuickActivity(triggerBtn){

function displayDate(v){
  if(!v) return '';
  try{
    const d=new Date(v);
    if(isNaN(d)) return String(v);
    return d.toLocaleDateString('en-PH',{
      year:'numeric',
      month:'long',
      day:'numeric'
    });
  }catch(e){
    return String(v);
  }
}

function displayTime(v){
  if(!v) return '';

  // Handles plain HH:mm / HH:mm:ss
  const s=String(v);
  const m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(m){
    let h=Number(m[1]);
    const min=m[2];
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    return `${h}:${min} ${ap}`;
  }

  // Handles Google Sheets time values serialized as 1899-12-30T...
  try{
    const d=new Date(v);
    if(!isNaN(d)){
      return d.toLocaleTimeString('en-PH',{
        hour:'numeric',
        minute:'2-digit',
        hour12:true,
        timeZone:'Asia/Manila'
      });
    }
  }catch(e){}

  return s;
}

function dateInputValue(v){
  if(!v) return '';
  if(typeof v==='string') return v.slice(0,10);
  try{
    const d=new Date(v);
    if(isNaN(d)) return '';
    return d.toISOString().slice(0,10);
  }catch(e){return ''}
}

window.BTO_PENDING_UPLOADS = window.BTO_PENDING_UPLOADS || {

function btoResetPendingUpload(key){
  if(window.BTO_PENDING_UPLOADS) window.BTO_PENDING_UPLOADS[key]='';
}

async function btoUploadDocumentFile(file, kind){
  if(!file) return '';

  const maxMb = kind==='image' ? 12 : 25;
  const maxBytes = maxMb * 1024 * 1024;

  if(file.size > maxBytes){
    throw new Error(`File is too large. Maximum allowed here is ${maxMb} MB.`);
  }

  if(kind==='pdf'){
    const ok=(file.type==='application/pdf') || /\.pdf$/i.test(file.name||'');
    if(!ok) throw new Error('Please select a PDF file.');
  }

  const base64=await fileToBase64(file);

  const u=await api('uploadBase64',{
    fileName:file.name,
    mimeType:file.type || (kind==='pdf'?'application/pdf':'application/octet-stream'),
    base64
  });

  if(!u.success){
    throw new Error('UPLOAD FAILED: ' + (u.message||'Unable to upload file.'));
  }

  if(!u.url){
    throw new Error('UPLOAD FAILED: backend did not return a file URL.');
  }

  return u.url;
}

        <button class="secondary" onclick="clearFullDisclosureForm()">Clear</button>
      </div>
    </div>

    <div class="card">
      <h2>Existing Full Disclosure Documents</h2>
      <div class="doc-list">
        ${rows.length ? rows.map(x=>`
          <div class="doc-row">
            <div class="doc-row-main">
              <div class="doc-row-title">${esc(x.title||'Untitled')}</div>
              <div class="doc-row-meta">${esc(x.year||'')} • ${esc(x.category||'')} • ${esc(x.status||'')}</div>
            </div>
            <div class="doc-row-actions">
              ${x.imageUrl?`<button class="secondary" onclick="window.open('${esc(x.imageUrl)}','_blank')">Image</button>`:''}
              ${x.pdfUrl?`<button class="secondary" onclick="window.open('${esc(x.pdfUrl)}','_blank')">PDF</button>`:''}
              <button onclick='editFullDisclosureDocument(${JSON.stringify(JSON.stringify(x))})'>Edit</button>
            </div>
          </div>`).join('') : '<div class="help">No Full Disclosure documents encoded yet.</div>'}

}

async function addDisclosureCategory(btn){
  return withButtonSpinner(btn,'Adding...',async()=>{
    const name=document.getElementById('newDisclosureCategory').value.trim();
    if(!name) throw new Error('Enter the new item/category name.');

    const r=await api('saveDisclosureCategory',{name,status:'ACTIVE'});
    if(!r.success) throw new Error(r.message||'Unable to add item.');

    const c=await api('getDisclosureCategories');
    if(c.success) window.BTO_DISCLOSURE_CATEGORIES=c.data||[];

    renderFullDisclosureModule();
    return r;
  },'Disclosure item added.');
}

function editFullDisclosureDocument(json){
  const x=JSON.parse(json);
  document.getElementById('fdId').value=x.id||'';
  document.getElementById('fdYear').value=x.year||currentYearValue();

  const sel=document.getElementById('fdCategory');
  if(x.category && !Array.from(sel.options).some(o=>o.value===x.category)){
    sel.insertAdjacentHTML('beforeend',`<option value="${esc(x.category)}">${esc(x.category)}</option>`);
  }
  sel.value=x.category||'';

  document.getElementById('fdTitle').value=x.title||'';
  document.getElementById('fdStatus').value=x.status||'PUBLISHED';

  const img=document.getElementById('fdCurrentImage');
  if(x.imageUrl){
    img.classList.remove('hidden');
    img.innerHTML=`Current image: <a href="${esc(x.imageUrl)}" target="_blank" rel="noopener">Open</a><br>Leave blank to keep it.`;
  }else{
    img.classList.add('hidden');
    img.innerHTML='';
  }

  const pdf=document.getElementById('fdCurrentPdf');
  if(x.pdfUrl){
    pdf.classList.remove('hidden');
    pdf.innerHTML=`Current PDF: <a href="${esc(x.pdfUrl)}" target="_blank" rel="noopener">Open</a><br>Leave blank to keep it.`;
  }else{
    pdf.classList.add('hidden');
    pdf.innerHTML='';
  }

  window.BTO_EDIT_DISCLOSURE=x;
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearFullDisclosureForm(){
  btoResetPendingUpload('disclosureImage');
  btoResetPendingUpload('disclosurePdf');
  window.BTO_EDIT_DISCLOSURE=null;
  document.getElementById('fdId').value='';
  document.getElementById('fdYear').value=currentYearValue();
  document.getElementById('fdCategory').value='';
  document.getElementById('fdTitle').value='';
  document.getElementById('fdImage').value='';
  document.getElementById('fdPdf').value='';
  document.getElementById('fdStatus').value='PUBLISHED';
  document.getElementById('fdCurrentImage').classList.add('hidden');
  document.getElementById('fdCurrentPdf').classList.add('hidden');
}

async function saveFullDisclosureDocument(btn){
  return withButtonSpinner(btn,'Saving...',async()=>{
    const imageFile=document.getElementById('fdImage').files[0];
    const pdfFile=document.getElementById('fdPdf').files[0];

    let imageUrl=window.BTO_PENDING_UPLOADS.disclosureImage || '';
    let pdfUrl=window.BTO_PENDING_UPLOADS.disclosurePdf || '';

    if(imageFile && !imageUrl){
      imageUrl=await btoUploadDocumentFile(imageFile,'image');
      window.BTO_PENDING_UPLOADS.disclosureImage=imageUrl;
    }

    if(pdfFile && !pdfUrl){
      pdfUrl=await btoUploadDocumentFile(pdfFile,'pdf');
      window.BTO_PENDING_UPLOADS.disclosurePdf=pdfUrl;
    }


    const r=await api('saveFullDisclosure',{
      id:document.getElementById('fdId').value,
      year:document.getElementById('fdYear').value,
      category:document.getElementById('fdCategory').value,
      title:document.getElementById('fdTitle').value,
      imageUrl,
      pdfUrl,
      status:document.getElementById('fdStatus').value
    });

    if(!r.success){
      throw new Error('SAVE FAILED: ' + (r.message||'The file may already be uploaded, but the record was not saved. Click Save again; uploaded files will be reused.'));
    }

    btoResetPendingUpload('disclosureImage');
    btoResetPendingUpload('disclosurePdf');

    await fullDisclosureForm();
    return r;
  },'Full Disclosure document saved.');
}

function normalizePortalImageUrl(url){
  url=String(url||'').trim();
  if(!url) return '';
  if(url.includes('drive.google.com')){
    let id='';
    let m=url.match(/[?&]id=([^&]+)/);
    if(m) id=m[1];
    if(!id){
      m=url.match(/\/d\/([^/]+)/);
      if(m) id=m[1];
    }
    if(id) return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
  }
  return url;
}

async function saveSiteMediaPhoto(triggerBtn,mediaKey,inputId,buttonId,statusId,label){
  const file=document.getElementById(inputId)?.files?.[0];
  const btn=document.getElementById(buttonId);
  const status=document.getElementById(statusId);

  if(!file){
    alert('Please select a photo first.');
    return;
  }

  btn.disabled=true;
  btn.innerHTML='<span class="save-mini-spinner"></span> Uploading...';
  status.className='save-status';
  status.textContent='Uploading photo...';

  try{
    const base64=await fileToBase64(file);

    const up=await api('uploadBase64',{
      fileName:file.name,
      mimeType:file.type||'image/jpeg',
      base64
    });
    if(!up.success) throw new Error(up.message);

    status.textContent='Saving...';

    const r=await api('saveSiteMedia',{
      mediaKey,
      label,
      url:up.url,
      status:'ACTIVE'
    });
    if(!r.success) throw new Error(r.message);

    status.className='save-status ok';
    status.textContent='Saved successfully.';
    setTimeout(siteMediaForm,650);

  }catch(err){
    status.className='save-status err';
    status.textContent=err.message||'Upload failed.';
  }finally{
    btn.disabled=false;
    btn.textContent='Upload & Save';
  }
}

  const r=await api('listCommittees');

function editCommitteeAdmin(id){
  const c=committeeAdminRows.find(x=>String(x.committeeId)===String(id));

  document.getElementById('cmId').value=c.committeeId||'';
  document.getElementById('cmName').value=c.committeeName||'';

  if(saveBtn) saveBtn.textContent='Save Changes';

  document.getElementById('cmName').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearCommitteeAdminForm(){
  document.getElementById('cmId').value='';
  document.getElementById('cmName').value='';
  document.getElementById('cmStatus').value='ACTIVE';
  document.getElementById('cmStatusMsg').textContent='';

  const saveBtn=document.getElementById('cmSaveBtn');
  if(saveBtn) saveBtn.textContent='Save Committee';
}


async function deleteCommitteeAdmin(btn,id,name){
  if(btn?.classList?.contains('is-busy')) return;

  const ok=confirm(
    `Delete "${name}"?\n\n`+
    'This is permanent. If the committee is still used in assignments, activities, or committee profile data, deletion will be blocked.'
  );

  if(!ok) return;

  setBusyButton(btn,true,'Deleting...');

  try{
    const r=await api('deleteCommittee',{committeeId:id});
    if(!r.success) throw new Error(r.message);

    showGlobalActionStatus(r.message || 'Committee deleted successfully.','ok');
    await refreshPortalCommitteesAfterChange();
    await committeesForm();

  }catch(err){
    showGlobalActionStatus(err.message || 'Delete failed.','err');
    alert(err.message || 'Delete failed.');
  }finally{
    setBusyButton(btn,false);
  }
}

async function saveCommitteeAdmin(btn){
  if(btn?.classList?.contains('is-busy')) return;

  const name=document.getElementById('cmName').value.trim();
  const msg=document.getElementById('cmStatusMsg');

  if(!name){
    alert('Committee Name is required.');
    return;
  }

  setBusyButton(btn,true,'Saving...');

  try{
    const r=await api('saveCommittee',{
      committeeId:document.getElementById('cmId').value.trim(),
      committeeName:name,
      status:document.getElementById('cmStatus').value
    });

    if(!r.success) throw new Error(r.message);

    msg.className='save-status ok';
    msg.textContent=r.message || 'Committee saved successfully.';
    showGlobalActionStatus(r.message || 'Committee saved successfully.','ok');

    await refreshPortalCommitteesAfterChange();
    await committeesForm();

  }catch(err){
    msg.className='save-status err';
    msg.textContent=err.message || 'Save failed.';
    showGlobalActionStatus(err.message || 'Save failed.','err');
  }finally{
    setBusyButton(btn,false);
  }
}

function showModuleError(message){
  document.getElementById('moduleArea').innerHTML=
    '<div class="card"><div class="msg err">'+esc(message)+'</div></div>';
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
